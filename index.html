:root{color-scheme:light;--bg:#f5f7fb;--panel:#fff;--border:#e2e7ef;--muted:#718096;--text:#243247;--brand:#4d668b;--brand2:#eaf0f8;--dark:#172b42;--shadow:0 8px 32px rgba(28,47,74,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft Yahei",sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100vh;min-height:600px}.side{background:#192b42;color:#d2ddec;display:flex;flex-direction:column;padding:25px 13px 18px}.logo{font-size:20px;font-weight:720;letter-spacing:-.5px;padding:2px 11px 3px;color:white}.sublogo{font-size:11px;opacity:.55;padding:0 11px 27px;letter-spacing:1px}.side .nav{display:flex;align-items:center;gap:12px;color:#cbd7e5;padding:13px;border-radius:10px;margin:2px 0;text-align:left;background:transparent;border:0;width:100%;font-size:13px}.nav:hover,.nav.active{background:#314966;color:white}.nav .sym{width:22px;text-align:center;font-size:17px}.side-foot{margin-top:auto;padding:14px 11px 5px;color:#90a4ba;font-size:11px;line-height:1.9}.sidebar-hint{font-size:10px;color:#9cabc0}.workspace{display:flex;flex-direction:column;min-width:0}.top{height:78px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 28px;background:var(--panel);border-bottom:1px solid var(--border)}.top h1{font-size:20px;margin:0;font-weight:690}.subtitle{color:var(--muted);font-size:12px;margin-top:4px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d8e0ea;background:white;color:var(--text);padding:9px 13px;border-radius:9px;font-size:12px}.btn:hover{background:#eff4f9}.btn.primary{background:var(--brand);color:white;border-color:var(--brand)}.btn.primary:hover{background:#3b5378}.btn.danger{color:#b24646}.main{overflow:auto;padding:25px 27px 45px;flex:1}.page-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:19px}.page-title h2{font-size:21px;margin:0}.page-title p{margin:6px 0 0;color:var(--muted);font-size:12px}.cols{display:grid;grid-template-columns:minmax(280px,1.45fr) minmax(255px,1fr);gap:17px}.card{background:white;border:1px solid var(--border);box-shadow:var(--shadow);border-radius:14px;padding:20px;min-width:0}.card h3{font-size:14px;margin:0 0 13px}.card p{line-height:1.8}.muted{color:var(--muted)}.small{font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:13px;margin-bottom:17px}.metric{background:white;border:1px solid var(--border);padding:20px;border-radius:13px}.metric strong{display:block;font-size:29px;font-weight:680;margin-bottom:7px}.metric span{color:var(--muted);font-size:12px}.pill{display:inline-block;border-radius:7px;background:#edf2f8;color:#4a678b;padding:5px 9px;font-size:11px;margin:3px 3px 3px 0}.pill.warm{background:#faf1e6;color:#a26c2a}.pill.green{background:#e7f4ed;color:#378260}.list{display:flex;flex-direction:column;gap:9px}.item{width:100%;border:1px solid #e2e8f0;border-radius:10px;background:#fafcff;text-align:left;padding:11px 13px;color:var(--text)}.item:hover,.item.selected{border-color:#829ab8;background:#f0f5fb}.item b{display:block;margin-bottom:5px}.item span{font-size:11px;color:var(--muted)}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field label{font-size:12px;color:#56677c}.field input,.field textarea,.field select{border:1px solid #d9e1eb;background:white;border-radius:9px;width:100%;padding:10px 11px;color:var(--text);outline-color:#91aac8}.field textarea{min-height:100px;resize:vertical;line-height:1.7}.editor-actions{display:flex;gap:8px;flex-wrap:wrap}.empty{background:#f6f9fc;color:var(--muted);border:1px dashed #d5dfeb;border-radius:12px;padding:25px;text-align:center;line-height:1.9}.graph-wrap{width:100%;height:420px;border:1px solid #e1e8ef;background:radial-gradient(circle at center,#fbfcfe,#f4f7fb);border-radius:12px;overflow:auto}.graph-wrap svg{display:block;min-width:530px;width:100%;height:420px}.graph-node{cursor:pointer}.graph-node rect{fill:#fff;stroke:#8a9fba;stroke-width:1.3;filter:drop-shadow(0 3px 5px #cbd5df55)}.graph-node:hover rect{stroke:#3e5a83;stroke-width:2}.graph-text{font-size:13px;fill:#26394f;text-anchor:middle;pointer-events:none}.graph-edge{stroke:#8ca0b9;stroke-width:1.8;fill:none}.graph-edge.dashed{stroke-dasharray:5 4}.graph-label{font-size:10px;fill:#678099;text-anchor:middle}.legend{display:flex;flex-wrap:wrap;align-items:center;gap:11px;color:var(--muted);font-size:11px;margin-top:13px}.dot{width:9px;height:9px;border-radius:50%;background:#718aa9;display:inline-block}.table-scroll{overflow:auto}.data-table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}.data-table th,.data-table td{padding:11px;border-bottom:1px solid var(--border);font-size:12px}.data-table th{background:#f5f8fb;color:#58687e;font-weight:650}.data-table tr:hover td{background:#f9fbfd}.light-divider{height:1px;background:var(--border);margin:17px 0}.alert{padding:12px 13px;border-radius:9px;background:#fff7ed;color:#875d29;margin-bottom:10px;font-size:12px;line-height:1.6}.inspector-title{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:#7b8ca1;margin-bottom:12px}.tips{padding:15px;border-radius:11px;background:#edf3f9;color:#4b6685;font-size:12px;line-height:1.9}.timeline-row{display:grid;grid-template-columns:78px 20px 1fr;gap:9px;min-height:64px}.timeline-time{font-size:12px;text-align:right;color:#647791;padding-top:4px;overflow-wrap:anywhere}.timeline-axis{position:relative;display:flex;justify-content:center}.timeline-axis:after{content:'';position:absolute;width:2px;top:16px;bottom:-4px;background:#d6e1ed}.timeline-axis:before{content:'';height:12px;width:12px;border:3px solid #738fb1;border-radius:50%;background:white;z-index:1}.timeline-event{margin-bottom:12px;border:1px solid var(--border);padding:12px;border-radius:10px;background:#fff}.timeline-event b{display:block;margin-bottom:4px}.copy{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.ai-prompt{white-space:pre-wrap;background:#f6f8fb;border:1px solid #e0e7ef;border-radius:11px;padding:15px;font-size:12px;line-height:1.7;max-height:300px;overflow:auto}.notice{background:#edf4f0;color:#376852;border:1px solid #d4e8d9;padding:12px;border-radius:10px;font-size:12px;margin:0 0 15px;display:none}.notice.error{background:#fff2f1;color:#a94949;border-color:#f0d4d1}a{color:#365b87;text-decoration:none}.footer-note{font-size:11px;color:#8292a6;padding:10px 0}.tag-grid{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #dbe4ee;border-radius:7px;background:#f7f9fc;padding:5px 8px;color:#4f6986;font-size:11px}.center{text-align:center}@media(max-width:950px){.app{grid-template-columns:73px 1fr}.side{padding:21px 8px}.logo{font-size:12px;padding:4px;text-align:center}.sublogo{display:none}.side .nav{padding:10px 2px;display:flex;flex-direction:column;gap:3px;font-size:9px;margin:8px 0}.side .nav .sym{font-size:18px}.side-foot{display:none}.metrics{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.top{height:auto;min-height:82px;align-items:flex-start;flex-direction:column}.main{padding:18px}.toolbar{width:100%}}@media(max-width:530px){.metric{padding:13px}.metrics{gap:8px}.top{padding:14px}.btn{padding:7px 8px;font-size:11px}.main{padding:11px}}

<body>
<div class="app"><aside class="side"><div class="logo">StoryLine</div><div class="sublogo">STUDIO · 简体中文原型</div><div id="nav"></div><div class="side-foot">纯本地运行 · 无须 Obsidian<br><span class="sidebar-hint">Alt + 1～7 切换模块</span></div></aside><div class="workspace"><header class="top"><div><h1 id="projectTitle">StoryLine Studio</h1><div class="subtitle">为小说创作者设计的独立中文工作台</div></div><div class="toolbar"><button class="btn" id="newProject">＋ 新项目</button><button class="btn" id="importFolder">导入 StoryLine 文件夹</button><button class="btn primary" id="backupBtn">↓ 导出备份</button></div></header><main class="main"><div id="notice" class="notice"></div><div id="content"></div><div class="footer-note">本软件为非官方独立原型；StoryLine 原项目 MIT Licensed · 本版导入源文件只读，不会修改原文件。</div></main></div></div>
<input id="folderFiles" type="file" multiple webkitdirectory directory hidden accept=".md,.markdown"><input id="jsonFiles" type="file" hidden accept=".json"><script>
'use strict';
const KEY='storyline-studio-lite-v1';
const tabs=[['总览','▦'],['人物关系','♧'],['剧情因果','◇'],['时间线','◷'],['章节管理','☷'],['世界观','◎'],['DeepSeek 顾问','✧']];
const demo={title:'北境纪元 · 演示项目',characters:[{name:'沈砚',role:'太子',personality:'谨慎、善于谋划',internalMotivation:'查清父皇死因',relations:[{target:'宁昭',category:'social',type:'ally'},{target:'沈珩',category:'conflict',type:'rival'}]},{name:'沈珩',role:'二皇子',personality:'野心勃勃',internalMotivation:'掌控朝廷',relations:[{target:'陆玄',category:'guidance',type:'leader'}]},{name:'宁昭',role:'女将军',personality:'果断、守信',internalMotivation:'避免内战',relations:[]},{name:'陆玄',role:'禁军统领',personality:'圆滑',internalMotivation:'保住自己的势力',relations:[]}],locations:[{name:'京城',locationType:'city',notes:'大晟国都，皇权斗争的中心。'},{name:'北境要塞',locationType:'fortress',notes:'宁昭统领的边军驻地。'}],scenes:[{id:'s1',title:'皇帝遇刺',act:1,chapter:1,sequence:1,storyDate:'初元十七年三月',pov:'沈砚',status:'draft',characters:['沈砚','陆玄'],location:'京城',tags:['宫廷线'],conflict:'谁策划了刺杀？',body:'深夜钟声骤起，皇城大门紧闭。',setup_scenes:[],payoff_scenes:[]},{id:'s2',title:'太子发动调查',act:1,chapter:2,sequence:2,storyDate:'三月初二',pov:'沈砚',status:'outlined',characters:['沈砚','宁昭'],location:'京城',tags:['宫廷线','调查线'],conflict:'禁军拒绝交出卷宗。',body:'',setup_scenes:[],payoff_scenes:[]},{id:'s3',title:'二皇子争权',act:1,chapter:3,sequence:3,storyDate:'三月初三',pov:'沈珩',status:'outlined',characters:['沈珩','陆玄'],location:'京城',tags:['宫廷线','夺权线'],conflict:'二皇子试图接管禁军。',body:'',setup_scenes:[],payoff_scenes:[]},{id:'s4',title:'朝廷分裂',act:1,chapter:4,sequence:4,storyDate:'三月初四',pov:'宁昭',status:'idea',characters:['宁昭','沈砚','沈珩'],location:'京城',tags:['宫廷线','夺权线'],conflict:'诸臣被迫选择阵营。',body:'',setup_scenes:[],payoff_scenes:[]}],causes:[{from:'s1',to:'s2',reason:'查明真相'},{from:'s1',to:'s3',reason:'权力真空'},{from:'s2',to:'s4',reason:'争夺证据'},{from:'s3',to:'s4',reason:'军权争议'}]};
let data,active=0,selectedCharacter=0,selectedScene=0,editing=false;
function clone(x){return JSON.parse(JSON.stringify(x))}function initial(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.scenes)&&Array.isArray(s.characters))return s}catch{}return clone(demo)}
data=initial();function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{notify('本地存储不可用，请立即导出备份。',true)}}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clean(s){return String(s||'').replace(/^\[\[/,'').replace(/\]\]$/,'').split('|').pop()}function uniq(a){return [...new Set(a)]}function bySeq(a,b){return Number(a.sequence||9999)-Number(b.sequence||9999)}function sceneName(id){return data.scenes.find(s=>s.id===id)?.title||id}function notify(t,error=false){let el=document.getElementById('notice');el.textContent=t;el.className='notice'+(error?' error':'');el.style.display='block';setTimeout(()=>{el.style.display='none'},6500)}function save(){persist();render()}
function parseScalar(s){s=(s||'').trim();if((s.startsWith('"')&&s.endsWith('"'))||(s.startsWith("'")&&s.endsWith("'")))s=s.slice(1,-1);if(s==='true')return true;if(s==='false')return false;if(/^[-+]?\d+(\.\d+)?$/.test(s))return Number(s);if(s.startsWith('[')&&s.endsWith(']')){try{return JSON.parse(s)}catch{return s.slice(1,-1).split(',').map(x=>parseScalar(x))}}return s}
function parseMd(text){let m=text.match(/^---\s*\r?\n([\s\S]*?)\r?\n---(?:\s*\r?\n|$)/);let head={},body=m?text.slice(m[0].length):text;if(!m)return{head,body};let lines=m[1].split(/\r?\n/);let key=null,complex=null;for(let line of lines){if(!line.trim()||/^\s*#/.test(line))continue;const top=line.match(/^([\w-]+):\s*(.*)$/);if(top){key=top[1];head[key]=top[2]?parseScalar(top[2]):[];complex=null;continue}if(!key)continue;const list=line.match(/^\s+-\s*(.*)$/);if(list){if(!Array.isArray(head[key]))head[key]=[];let kv=list[1].match(/^([\w-]+):\s*(.*)$/);if(kv){complex={[kv[1]]:parseScalar(kv[2])};head[key].push(complex)}else{complex=null;head[key].push(parseScalar(list[1]))}continue}const sub=line.match(/^\s+([\w-]+):\s*(.*)$/);if(sub&&complex){complex[sub[1]]=parseScalar(sub[2])}}return{head,body}}
function normalizedArray(x){return Array.isArray(x)?x.map(y=>clean(y)).filter(Boolean):typeof x==='string'&&x?x.split(',').map(z=>clean(z.trim())):[]}
function parseFiles(files){let scenes=[],characters=[],locations=[],title='导入的 StoryLine 项目';for(let f of files){let path=f.path||f.name||'';let {head:h,body}=parseMd(f.text||'');let type=String(h.type||'').toLowerCase();if(type==='storyline-project'){title=h.title||title;continue}if(type==='scene'||/\/Scenes\//i.test('/'+path)){scenes.push({id:path,title:h.title||f.name.replace(/\.md$/i,''),act:h.act||1,chapter:h.chapter||1,sequence:Number(h.sequence||scenes.length+1),chronologicalOrder:h.chronologicalOrder,storyDate:h.storyDate||'',pov:clean(h.pov),status:h.status||'idea',characters:normalizedArray(h.characters),location:clean(h.location),tags:normalizedArray(h.tags),conflict:h.conflict||'',body,setup_scenes:normalizedArray(h.setup_scenes),payoff_scenes:normalizedArray(h.payoff_scenes)});continue}if(type==='character'||/\/Characters\//i.test('/'+path)){characters.push({name:h.name||f.name.replace(/\.md$/i,''),role:h.role||'',personality:h.personality||'',internalMotivation:h.internalMotivation||'',notes:body,relations:Array.isArray(h.relations)?h.relations.filter(x=>x&&typeof x==='object'&&x.target).map(x=>({target:clean(x.target),category:x.category||'other',type:x.type||''})):[]});continue}if(type==='location'||type==='world'||/\/Locations\//i.test('/'+path)){locations.push({name:h.name||f.name.replace(/\.md$/i,''),locationType:h.locationType||type||'location',notes:body});continue}}
if(!scenes.length&&!characters.length&&!locations.length)throw Error('所选文件中没有识别到 StoryLine 场景、人物或地点。');return{title,scenes:scenes.sort(bySeq),characters,locations,causes:[]}}
function pageHeader(title,subtitle,right=''){return `<div class="page-title"><div><h2>${safe(title)}</h2><p>${safe(subtitle)}</p></div>${right}</div>`}
function renderNav(){document.getElementById('nav').innerHTML=tabs.map((t,i)=>`<button class="nav ${i===active?'active':''}" data-tab="${i}"><span class="sym">${t[1]}</span><span>${t[0]}</span></button>`).join('')}
function render(){document.getElementById('projectTitle').textContent=data.title;renderNav();let view=[home,relationships,causality,timeline,chapters,world,ai][active];document.getElementById('content').innerHTML=view()}
function home(){const tags=uniq(data.scenes.flatMap(s=>s.tags||[]));return pageHeader('创作总览','你的世界、人物、剧情与时间线集中在这里。')+`<div class="metrics"><div class="metric"><strong>${data.scenes.length}</strong><span>场景节点</span></div><div class="metric"><strong>${data.characters.length}</strong><span>人物角色</span></div><div class="metric"><strong>${data.locations.length}</strong><span>地点设定</span></div><div class="metric"><strong>${tags.length}</strong><span>剧情线路</span></div></div><div class="cols"><section class="card"><h3>最近场景</h3><div class="list">${data.scenes.slice().sort(bySeq).slice(0,6).map(s=>`<button class="item" data-open-scene="${safe(s.id)}"><b>${safe(s.title)}</b><span>第 ${safe(s.act)} 幕 · 第 ${safe(s.chapter)} 章 · ${safe(s.pov||'无视角角色')} · ${safe(s.status||'idea')}</span></button>`).join('')||'<div class="empty">暂无场景</div>'}</div></section><section class="card"><h3>开始创作</h3><p class="muted small">你可以先添加人物和场景，再在「剧情因果」中建立事件之间的原因与结果。</p><div class="editor-actions"><button class="btn primary" data-action="add-scene">＋ 新建场景</button><button class="btn" data-action="add-character">＋ 新建人物</button></div><div class="light-divider"></div><h3>当前剧情线</h3><div>${tags.length?tags.map(t=>`<span class="pill">${safe(t)}</span>`).join(''):'<span class="muted small">暂无剧情线</span>'}</div><div class="light-divider"></div><div class="tips">StoryLine 原版的场景、人物和地点以 Markdown 保存。这里支持导入这些内容，但不会自动继承原版的全部配置或互动功能。</div></section></div>`}
function graph(kind){let items=kind==='people'?data.characters.map((c,i)=>({id:c.name,label:c.name,sub:c.role||'人物',n:i})):data.scenes.slice().sort(bySeq).map((s,i)=>({id:s.id,label:s.title,sub:`第${s.chapter||'?'}章`,n:i}));if(!items.length)return'<div class="empty">没有可以绘制的节点</div>';let w=Math.max(560,items.length*115),h=420,points={},xgap=Math.max(105,w/(items.length+1));items.forEach((v,i)=>{let x=55+i*xgap;let y=kind==='people'?205+(i%2===0?-80:70):105+(i%3)*95;points[v.id]={x,y}});let edges=[];if(kind==='people')for(let c of data.characters)for(let r of c.relations||[])if(points[c.name]&&points[r.target])edges.push({from:c.name,to:r.target,label:r.type||r.category||'关系'});else{}else{}if(kind==='story')edges=[...data.causes.map(c=>({...c,kind:'cause'}))];let parts=`<div class="graph-wrap"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="可点击节点的关系网络图">`;
for(let e of edges){let a=points[e.from],b=points[e.to];if(!a||!b)continue;let x1=a.x,y1=a.y,x2=b.x,y2=b.y;parts+=`<line class="graph-edge" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><text class="graph-label" x="${(x1+x2)/2}" y="${(y1+y2)/2-8}">${safe(e.label||e.reason||'因果')}</text>`}
for(let v of items){let p=points[v.id];parts+=`<g class="graph-node" data-graph-kind="${kind}" data-node="${safe(v.id)}"><rect x="${p.x-53}" y="${p.y-25}" rx="9" width="106" height="54"/><text class="graph-text" x="${p.x}" y="${p.y-2}">${safe(String(v.label).slice(0,9))}</text><text class="graph-label" x="${p.x}" y="${p.y+15}">${safe(v.sub)}</text></g>`}return parts+'</svg></div>'}
function relationships(){if(selectedCharacter>=data.characters.length)selectedCharacter=0;let c=data.characters[selectedCharacter];return pageHeader('人物关系','人物网络 + 角色档案，点击图中的人物或左侧名单定位。',`<button class="btn primary" data-action="add-character">＋ 创建人物</button>`)+`<div class="cols"><section class="card"><h3>角色关系网络</h3>${graph('people')}<div class="legend"><span><i class="dot"></i> 点击人物节点可查看档案</span><span>连线来自 StoryLine 的 relations 字段</span></div><div class="light-divider"></div><h3>角色列表</h3><div class="list">${data.characters.map((p,i)=>`<button class="item ${selectedCharacter===i?'selected':''}" data-character="${i}"><b>${safe(p.name)}</b><span>${safe(p.role||'未指定角色')} · ${(p.relations||[]).length} 条已记录关系</span></button>`).join('')||'<div class="empty">暂无人物</div>'}</div></section><section class="card"><div class="inspector-title">人物档案</div>${c?`<div class="field"><label>姓名</label><input id="c-name" value="${safe(c.name)}"></div><div class="field"><label>身份 / 职业</label><input id="c-role" value="${safe(c.role||'')}"></div><div class="field"><label>性格特征</label><textarea id="c-personality">${safe(c.personality||'')}</textarea></div><div class="field"><label>内部动机</label><textarea id="c-motive">${safe(c.internalMotivation||'')}</textarea></div><h3>人物关系</h3><div>${(c.relations||[]).map(r=>`<span class="pill">${safe(r.target)} · ${safe(r.type||r.category)}</span>`).join('')||'<p class="muted small">暂无关系</p>'}</div><div class="editor-actions"><button class="btn primary" data-action="save-character">保存档案</button><button class="btn" data-action="add-relation">＋ 增加关系</button></div>`:'<div class="empty">先创建一个人物</div>'}</section></div>`}
function causality(){let s=data.scenes[selectedScene];let missing=data.scenes.filter(x=>!x.pov||!x.conflict);return pageHeader('剧情因果网络','实线是你添加的事件因果；伏笔与回收在下方独立显示。',`<button class="btn primary" data-action="add-cause">＋ 连接事件因果</button>`)+`<div class="cols"><section class="card"><h3>事件因果图</h3>${graph('story')}<div class="legend"><span>点击事件节点可查看详情</span><span>导入 StoryLine 时不把伏笔误认为因果</span></div><div class="light-divider"></div><h3>因果关系</h3><div class="list">${data.causes.map((l,i)=>`<div class="item"><b>${safe(sceneName(l.from))} → ${safe(sceneName(l.to))}</b><span>${safe(l.reason||'因果关系')} <button class="btn danger" data-remove-cause="${i}" style="float:right;padding:2px 6px">移除</button></span></div>`).join('')||'<div class="empty">暂无因果关系，点击右上角新建。</div>'}</div></section><section class="card"><h3>故事一致性提醒</h3>${missing.map(x=>`<div class="alert">${safe(x.title)}：${!x.pov?'缺少 POV 视角角色；':''}${!x.conflict?'缺少场景冲突。':''}</div>`).join('')||'<div class="tips">所有场景都有视角角色和冲突设定（不代表故事逻辑已经全部验证）。</div>'}<div class="light-divider"></div><h3>伏笔与回收</h3>${data.scenes.flatMap(sc=>(sc.payoff_scenes||[]).map(t=>({a:sc.title,b:t}))).map(e=>`<p class="small">${safe(e.a)} → ${safe(e.b)}</p>`).join('')||'<p class="muted small">暂无导入的伏笔与回收链接。StoryLine 的 setup / payoff 和事件因果是不同的概念。</p>'}<div class="light-divider"></div><div class="tips">DeepSeek 可以辅助检查动机、因果与信息差，但本原型不会自动推断或修改你的故事。</div></section></div>`}
function timeline(){let ss=data.scenes.slice().sort((a,b)=>Number(a.chronologicalOrder??a.sequence??999)-Number(b.chronologicalOrder??b.sequence??999));return pageHeader('世界时间线','按原始 chronologicalOrder（如有）或场景顺序展示，不猜测架空历法。')+`<div class="card"><h3>事件顺序</h3>${ss.map(s=>`<div class="timeline-row"><div class="timeline-time">${safe(s.storyDate||'第'+s.sequence+'幕')}</div><div class="timeline-axis"></div><button class="timeline-event item" data-open-scene="${safe(s.id)}"><b>${safe(s.title)}</b><span>${safe(s.pov||'未知视角')} · ${safe(s.location||'未知地点')} · ${safe(s.conflict||'未写冲突')}</span></button></div>`).join('')||'<div class="empty">暂无事件</div>'}</div>`}
function chapters(){if(selectedScene>=data.scenes.length)selectedScene=0;let ss=data.scenes.slice().sort(bySeq);let s=data.scenes[selectedScene];return pageHeader('章节与场景','按幕、章、顺序组织场景；正文与场景信息保存在本地原型草稿中。',`<button class="btn primary" data-action="add-scene">＋ 新建场景</button>`)+`<div class="cols"><section class="card"><h3>章节列表</h3><div class="list">${ss.map(p=>`<button class="item ${s?.id===p.id?'selected':''}" data-open-scene="${safe(p.id)}"><b>${safe(p.title)}</b><span>幕 ${safe(p.act)} · 章 ${safe(p.chapter)} · ${safe(p.pov||'无视角')} · ${safe(p.status||'idea')}</span></button>`).join('')||'<div class="empty">暂无章节</div>'}</div></section><section class="card"><div class="inspector-title">编辑场景</div>${s?`<div class="field"><label>场景标题</label><input id="s-title" value="${safe(s.title)}"></div><div class="field"><label>幕 / 章 / 顺序</label><div style="display:flex;gap:8px"><input id="s-act" type="number" min="1" value="${safe(s.act||1)}"><input id="s-chapter" type="number" min="1" value="${safe(s.chapter||1)}"><input id="s-sequence" type="number" min="1" value="${safe(s.sequence||1)}"></div></div><div class="field"><label>视角人物</label><input id="s-pov" value="${safe(s.pov||'')}"></div><div class="field"><label>世界日期（允许自定义历法）</label><input id="s-date" value="${safe(s.storyDate||'')}"></div><div class="field"><label>剧情线标签（逗号分隔）</label><input id="s-tags" value="${safe((s.tags||[]).join(', '))}"></div><div class="field"><label>场景冲突</label><textarea id="s-conflict">${safe(s.conflict||'')}</textarea></div><div class="field"><label>正文（Markdown）</label><textarea id="s-body" style="min-height:250px">${safe(s.body||'')}</textarea></div><div class="editor-actions"><button class="btn primary" data-action="save-scene">保存草稿</button><button class="btn danger" data-action="remove-scene">删除此场景</button></div>`:'<div class="empty">请选择场景</div>'}</section></div>`}
function world(){const placeCount=data.locations.length;return pageHeader('世界观设定','你的城市、国家、势力、规则与背景资料。',`<button class="btn primary" data-action="add-place">＋ 新建地点</button>`)+`<div class="metrics"><div class="metric"><strong>${placeCount}</strong><span>地点 / 世界节点</span></div><div class="metric"><strong>${data.characters.length}</strong><span>人物档案</span></div><div class="metric"><strong>${data.scenes.length}</strong><span>故事事件</span></div><div class="metric"><strong>${uniq(data.scenes.flatMap(s=>s.tags||[])).length}</strong><span>剧情线主题</span></div></div><div class="cols"><div class="card"><h3>地点与世界</h3><div class="list">${data.locations.map((loc,i)=>`<div class="item"><b>${safe(loc.name)}</b><span>${safe(loc.locationType||'地点')} · ${safe(String(loc.notes||'').slice(0,110))}</span></div>`).join('')||'<div class="empty">暂无地点设定</div>'}</div></div><div class="card"><h3>关于世界观数据</h3><p class="muted small">原 StoryLine 将人物、地点、世界、事件分别存储为 Markdown 文件。导入文件夹可以恢复基础数据。原插件的自定义 Codex 类别、媒体资源、复杂关系历史等，目前尚未完全移植。</p><div class="tips">建议先从人物和地点入手，所有重要设定都建立明确档案，再让 DeepSeek 对多个档案做交叉审查。</div></div></div>`}
function promptText(){let chars=data.characters.map(c=>`- ${c.name}（${c.role||'未知身份'}）：性格 ${c.personality||'未定义'}，动机 ${c.internalMotivation||'未定义'}。关系：${(c.relations||[]).map(r=>`${r.target}(${r.type||r.category})`).join('、')||'无'}`).join('\n');let scenes=data.scenes.slice().sort(bySeq).map(s=>`- ${s.title}：视角 ${s.pov||'未知'}；时间 ${s.storyDate||'未知'}；人物 ${(s.characters||[]).join('、')}；地点 ${s.location||'未知'}；冲突 ${s.conflict||'未定义'}`).join('\n');let cause=data.causes.map(x=>`${sceneName(x.from)} -> ${sceneName(x.to)}：${x.reason}`).join('\n');return `你是我的小说世界观与人物因果逻辑审查员，不是代笔人。\n\n请检查以下资料：\n1. 人物是否存在行为动机不充分、信息差错误或自相矛盾。\n2. 事件因果是否成立；区分“事件先后”与“真正因果”。\n3. 提出需要补充铺垫的场景并说明原因。\n4. 不要自动续写小说，不要编造未确认的世界设定。\n5. 以“问题-证据-影响-修复选项”的格式输出；没有证据的地方标记“无法确定”。\n\n【人物】\n${chars}\n\n【场景】\n${scenes}\n\n【已确认的因果】\n${cause||'暂无'}\n\n请只依据以上资料审查。`}
function ai(){return pageHeader('DeepSeek · 小说逻辑顾问','先通过安全的“复制上下文”方式参与，后续可改成桌面端 API 自动连接。')+`<div class="cols"><section class="card"><h3>现阶段已能使用的方式</h3><p class="small muted">点击复制，自动整理当前项目的人物动机、关系、场景和因果信息；然后粘贴到 DeepSeek。无需密钥，也不会将文件自动上传到任何服务器。</p><div class="editor-actions"><button class="btn primary" data-action="copy-ai">复制完整审查提示词</button><button class="btn" data-action="open-deepseek">打开 DeepSeek 网页</button></div><div class="light-divider"></div><h3>将发送给 AI 的文本预览</h3><div class="ai-prompt" id="ai-preview">${safe(promptText())}</div></section><section class="card"><h3>未来的深度接入</h3><p class="small muted">正式桌面版可由本机 Node/Electron 主进程保存 API 密钥并请求 DeepSeek，避免把密钥放在网页中。</p><div class="tips"><b>安全原则</b><br>默认只读<br>AI 建议先展示差异再确认<br>不允许无确认地批量改动世界观<br>保留每次修改的版本历史</div><div class="light-divider"></div><p class="small muted">本原型未接入在线模型；不会假装能够自动完成智能分析。</p></section></div>`}
function addScene(){let title=prompt('场景名称：');if(!title)return;let s={id:'new-'+Date.now(),title:title.trim(),act:1,chapter:data.scenes.length+1,sequence:data.scenes.length+1,storyDate:'',pov:'',status:'idea',characters:[],location:'',tags:[],conflict:'',body:'',setup_scenes:[],payoff_scenes:[]};data.scenes.push(s);selectedScene=data.scenes.length-1;active=4;save()}
function addCharacter(){let name=prompt('角色姓名：');if(!name)return;data.characters.push({name:name.trim(),role:'',personality:'',internalMotivation:'',relations:[]});selectedCharacter=data.characters.length-1;active=1;save()}
function addCause(){if(data.scenes.length<2){notify('至少需要两个场景才能建立因果关系。',true);return}let options=data.scenes.map((s,i)=>`${i+1}. ${s.title}`).join('\n');let a=Number(prompt('原因事件编号：\n'+options));let b=Number(prompt('结果事件编号：\n'+options));if(!a||!b||a===b||!data.scenes[a-1]||!data.scenes[b-1])return notify('请选择两个不同的有效事件。',true);let reason=prompt('说明因果关系（为什么前者导致后者）：','')||'';data.causes.push({from:data.scenes[a-1].id,to:data.scenes[b-1].id,reason});save()}
function addRelation(){const c=data.characters[selectedCharacter];if(!c)return;let other=data.characters.filter(x=>x!==c);if(!other.length)return notify('请先添加至少两名人物。',true);let ix=Number(prompt('将该人物与谁建立关系？\n'+other.map((x,i)=>`${i+1}. ${x.name}`).join('\n')));if(!other[ix-1])return;let kind=prompt('关系类型（例如 ally、rival、sibling、mentor）：','ally');if(!kind)return;c.relations=c.relations||[];c.relations.push({target:other[ix-1].name,category:'custom',type:kind});save()}
function val(id){return document.getElementById(id)?.value||''}function saveScene(){let s=data.scenes[selectedScene];if(!s)return;s.title=val('s-title').trim()||s.title;s.act=Number(val('s-act'))||1;s.chapter=Number(val('s-chapter'))||1;s.sequence=Number(val('s-sequence'))||1;s.pov=val('s-pov').trim();s.storyDate=val('s-date').trim();s.tags=val('s-tags').split(',').map(x=>x.trim()).filter(Boolean);s.conflict=val('s-conflict');s.body=val('s-body');save();notify('已保存到浏览器本地草稿。记得导出 JSON 备份。')}
function saveCharacter(){let c=data.characters[selectedCharacter];if(!c)return;let old=c.name;let name=val('c-name').trim();if(name)c.name=name;c.role=val('c-role');c.personality=val('c-personality');c.internalMotivation=val('c-motive');if(name&&old!==name){for(let s of data.scenes){if(s.pov===old)s.pov=name;s.characters=(s.characters||[]).map(n=>n===old?name:n)}for(let p of data.characters)for(let r of p.relations||[])if(r.target===old)r.target=name}save();notify('人物档案已保存到本地草稿。')}
function backup(){let blob=new Blob([JSON.stringify({format:'storyline-studio-prototype',version:1,exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json;charset=utf-8'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='StoryLine-Studio-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function createProject(){if(!confirm('创建新项目会替换当前浏览器草稿。请先导出备份。确定继续？'))return;let title=prompt('请输入项目名称：','我的小说');if(!title)return;data={title,scenes:[],characters:[],locations:[],causes:[]};active=0;selectedScene=0;selectedCharacter=0;save()}
document.addEventListener('click',e=>{let btn=e.target.closest('button,[data-graph-kind]');if(!btn)return;if(btn.dataset.tab!==undefined){active=Number(btn.dataset.tab);render();return}if(btn.dataset.character!==undefined){selectedCharacter=Number(btn.dataset.character);active=1;render();return}if(btn.dataset.openScene!==undefined){selectedScene=data.scenes.findIndex(s=>s.id===btn.dataset.openScene);if(selectedScene<0)selectedScene=0;active=4;render();return}if(btn.dataset.node!==undefined){let id=btn.dataset.node;if(btn.dataset.graphKind==='people'){selectedCharacter=data.characters.findIndex(c=>c.name===id);active=1}else{selectedScene=data.scenes.findIndex(s=>s.id===id);active=4}render();return}if(btn.dataset.removeCause!==undefined){data.causes.splice(Number(btn.dataset.removeCause),1);save();return}
switch(btn.dataset.action){case'add-scene':addScene();break;case'add-character':addCharacter();break;case'add-cause':addCause();break;case'add-relation':addRelation();break;case'save-scene':saveScene();break;case'save-character':saveCharacter();break;case'add-place':{let name=prompt('地点名称：');if(name){data.locations.push({name,locationType:'location',notes:''});save()}break}case'remove-scene':{let s=data.scenes[selectedScene];if(!s||!confirm('确定删除当前草稿中的 '+s.title+'？'))break;data.causes=data.causes.filter(x=>x.from!==s.id&&x.to!==s.id);data.scenes.splice(selectedScene,1);selectedScene=0;save();break}case'copy-ai':{let text=promptText();if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>notify('已复制。你可以粘贴到 DeepSeek。')).catch(()=>fallbackCopy(text))}else fallbackCopy(text);break}case'open-deepseek':window.open('https://chat.deepseek.com','_blank','noopener,noreferrer');break;}}
);
function fallbackCopy(text){let ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-10000px;top:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');notify('已复制上下文。')}catch{notify('自动复制失败，请选中文本手动复制。',true)}ta.remove()}
document.getElementById('newProject').onclick=createProject;document.getElementById('backupBtn').onclick=backup;document.getElementById('importFolder').onclick=()=>document.getElementById('folderFiles').click();document.getElementById('folderFiles').onchange=async e=>{let files=[...(e.target.files||[])].filter(f=>/\.md$/i.test(f.name));if(!files.length){notify('未找到 Markdown 文件，请选择 StoryLine 项目文件夹。',true);return}try{let payload=await Promise.all(files.map(async f=>({name:f.name,path:f.webkitRelativePath||f.name,text:await f.text()})));let imported=parseFiles(payload);if(!confirm(`识别到 ${imported.scenes.length} 个场景、${imported.characters.length} 名人物、${imported.locations.length} 个地点。导入会覆盖当前浏览器草稿，但不修改原文件。建议先备份。继续？`))return;data=imported;selectedScene=0;selectedCharacter=0;active=0;save();notify('导入完成。原始 Markdown 文件保持不变。')}catch(err){notify('导入失败：'+err.message,true)}finally{e.target.value=''}};
window.addEventListener('keydown',e=>{if(e.altKey&&!e.ctrlKey&&!e.metaKey&&/^[1-7]$/.test(e.key)){e.preventDefault();active=Number(e.key)-1;render()}});
render();
</script>
</body></html>
